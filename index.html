<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F5F0E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NICE">
  <title>NICE · Business & Legal English</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
/* =========================================================
   NICE — quiet luxury, sala de conselho.
   VOICE: sóbrio, confiante, humor seco.
   IDEA: um dossiê de M&A bem encadernado — papel marfim, tinta escura, carimbo bordô.
   COLOUR: marfim + tons empoeirados (rosa antigo, manteiga, sálvia, pedra);
           bordô e latão só em momentos-chave. À noite: café, grafite e latão.
   TYPE: Cormorant Garamond (títulos) + Instrument Sans (texto).
   LAYOUT: coluna de celular, cartões calmos, um foco por tela.
   ========================================================= */
:root {
  --bg: #f5f0e6;
  --surface: #fffdf8;
  --surface-2: #efe8db;
  --ink: #1f1c18;
  --muted: #776f66;
  --line: #e3dacb;
  --tint-ink: rgba(31, 28, 24, .68);
  --overlay: rgba(31, 28, 24, .38);
  --primary-bg: #1f1c18;
  --primary-ink: #f5f0e6;

  /* tons empoeirados (unidades e cartões) — nomes antigos mantidos como apelidos */
  --pink: #eddad4;    /* rosa antigo */
  --yellow: #f2e6c3;  /* manteiga */
  --lilac: #e2dfe6;   /* névoa */
  --mint: #dce3cf;    /* sálvia */
  --coral: #ecd7c7;   /* argila */
  --lime: #e7e1d3;    /* pedra */
  --blue: #dbe2e3;    /* cinza-azulado */

  /* cores de momento (usadas com parcimônia) */
  --accent: #7a2e3a;      /* bordô: progresso, lição atual, XP */
  --accent-soft: #f1e2e1;
  --brass: #a8874f;       /* latão: detalhes */
  --good: #3e6b47;
  --good-bg: #e2ebdc;
  --bad: #9b2c3a;
  --bad-bg: #f6e1e1;
  --flame: #b8763a;
  --red: #9b2c3a;
  --wrong-bg: #f6e1e1;

  /* selos de equivalência */
  --eq-direct: #dce3cf; --eq-approx: #f2e6c3; --eq-none: #eddad4;

  /* painel de destaque (início) */
  --hero-bg: #1f1c18;
  --hero-ink: #f3ecdf;

  --serif: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display: var(--serif);
  --italic: var(--serif);
  --clause: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --col: 480px;
  --r: 20px;
  --shadow: 0 1px 2px rgba(31, 28, 24, .05), 0 8px 24px rgba(31, 28, 24, .06);
  --shadow-up: 0 2px 4px rgba(31, 28, 24, .06), 0 14px 36px rgba(31, 28, 24, .10);
  color-scheme: light;
}

/* ---------- modo noturno: café, grafite e latão ---------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14120f; --surface: #1d1a16; --surface-2: #26221d; --ink: #eee7da; --muted: #a39a8d; --line: #322d26;
    --tint-ink: rgba(238, 231, 218, .66); --overlay: rgba(0, 0, 0, .55);
    --primary-bg: #eee7da; --primary-ink: #14120f;
    --pink: #352829; --yellow: #352f21; --lilac: #2a2830; --mint: #283025; --coral: #382b23; --lime: #2d2a24; --blue: #252d30;
    --accent: #d39aa3; --accent-soft: #3a2629; --brass: #cdaa6e;
    --good: #9ccaa3; --good-bg: #1f2c21; --bad: #e59ea7; --bad-bg: #3a2226; --flame: #e0a05f; --red: #e59ea7; --wrong-bg: #3a2226;
    --hero-bg: #26221d; --hero-ink: #f3ecdf;
    --eq-direct: #33402f; --eq-approx: #463c27; --eq-none: #4a3033;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --shadow-up: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14120f; --surface: #1d1a16; --surface-2: #26221d; --ink: #eee7da; --muted: #a39a8d; --line: #322d26;
  --tint-ink: rgba(238, 231, 218, .66); --overlay: rgba(0, 0, 0, .55);
  --primary-bg: #eee7da; --primary-ink: #14120f;
  --pink: #352829; --yellow: #352f21; --lilac: #2a2830; --mint: #283025; --coral: #382b23; --lime: #2d2a24; --blue: #252d30;
  --accent: #d39aa3; --accent-soft: #3a2629; --brass: #cdaa6e;
  --good: #9ccaa3; --good-bg: #1f2c21; --bad: #e59ea7; --bad-bg: #3a2226; --flame: #e0a05f; --red: #e59ea7; --wrong-bg: #3a2226;
  --hero-bg: #26221d; --hero-ink: #f3ecdf;
  --eq-direct: #33402f; --eq-approx: #463c27; --eq-none: #4a3033;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  --shadow-up: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 36px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; min-width: 0; }
html, body { margin: 0; }
body { font: 16px/1.55 var(--body); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; overflow-x: clip; }
.app { max-width: var(--col); margin: 0 auto; min-height: 100vh; min-height: 100dvh; background: var(--bg); position: relative; }
@media (min-width: 520px) {
  body { background: var(--surface-2); }
  .app { box-shadow: 0 0 0 1px var(--line), 0 0 60px rgba(0, 0, 0, .06); }
}

h1, h2, h3 { font-family: var(--serif); font-weight: 600; letter-spacing: -0.005em; margin: 0; line-height: 1.1; }
h1, h2, h3, em, .big-num, .lesson-pill .num, .stat b, .mini-stats b, .level-big, .question, .term-en { font-variant-numeric: lining-nums; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
em { font-family: var(--serif); font-style: italic; font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex-shrink: 0; }

/* ---------- números grandes ---------- */
.big-num { display: grid; justify-items: center; line-height: .95; }
.big-num b { font-family: var(--serif); font-weight: 600; font-size: 76px; letter-spacing: -0.02em; }
.big-num span { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--muted); }
.big-num.result-num b { font-size: 104px; color: var(--accent); }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

/* ---------- botões & chips ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 24px; border-radius: 999px; border: 0;
  font-weight: 600; font-size: 15px; letter-spacing: .01em; cursor: pointer; transition: transform .1s ease, opacity .15s, box-shadow .15s;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--primary-bg); color: var(--primary-ink); }
.btn.primary:hover:not(:disabled) { opacity: .9; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.ghost:hover { box-shadow: inset 0 0 0 1px var(--muted); }
.btn.danger { background: var(--bad); color: var(--surface); }
.btn.wide { width: 100%; }
.btn:disabled { background: var(--surface-2); color: var(--muted); cursor: not-allowed; opacity: .7; }
.btn svg { width: 18px; height: 18px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 0;
  background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font-weight: 500; font-size: 13px; white-space: nowrap; cursor: pointer;
}
.chip.ink { background: var(--primary-bg); color: var(--primary-ink); box-shadow: none; }
.chip.outline { background: var(--surface); }
.chip.tiny { padding: 2px 8px; font-size: 11px; background: var(--accent-soft); color: var(--accent); box-shadow: none; margin-left: auto; cursor: default; font-weight: 600; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px var(--line); }
span.chip { cursor: default; }

.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.speak {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink);
  box-shadow: var(--shadow); display: inline-grid; place-items: center; cursor: pointer; vertical-align: middle; transition: transform .1s;
}
.speak:active { transform: scale(.92); }
.speak svg { width: 18px; height: 18px; }
.speak.small { width: 30px; height: 30px; }
.speak.small svg { width: 15px; height: 15px; }
.link-btn { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

/* ---------- estrutura de tela ---------- */
.screen { padding: 16px 20px 120px; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.logo { display: grid; line-height: 1; width: fit-content; }
.logo b { font-family: var(--serif); font-weight: 600; font-size: 26px; letter-spacing: .32em; margin-right: -.32em; }
.logo small { font-size: 9px; letter-spacing: .28em; text-transform: uppercase; color: var(--brass); margin-top: 4px; font-weight: 600; }
.pills { display: flex; gap: 8px; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 999px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 13px; color: var(--muted);
}
.pill svg { width: 15px; height: 15px; }
.pill.cloud { border: 0; cursor: pointer; padding: 0 10px; }
.pill.cloud.ok svg { color: var(--good); }
.pill.cloud.busy svg { color: var(--accent); animation: blink 1.2s infinite ease-in-out; }
.pill.cloud.warn svg { color: var(--flame); }
.pill.hot { color: var(--ink); }
.pill.hot svg { color: var(--flame); }

.page-title { font-size: 38px; margin: 4px 0 6px; }
.page-title em { color: var(--muted); }
.page-sub { font-size: 15px; margin-bottom: 18px; color: var(--muted); }
.section-title { font-size: 26px; margin: 30px 0 14px; }
.section-title em { color: var(--muted); }
.kicker { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--tint-ink); }
.footer-quote { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); text-align: center; margin: 34px 16px 0; line-height: 1.3; }

/* ---------- início ---------- */
.hero { background: var(--hero-bg); color: var(--hero-ink); border-radius: 26px; padding: 24px 22px 22px; display: grid; gap: 8px; margin-top: 4px; }
.hero-hi { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--brass); font-weight: 600; }
.hero-title { font-family: var(--serif); font-size: 30px; font-weight: 500; line-height: 1.15; }
.hero-xp { font-size: 13px; color: rgba(243, 236, 223, .6); }
.hero-xp strong { color: var(--hero-ink); }
.hero .btn { margin-top: 10px; background: var(--hero-ink); color: #1f1c18; }
.all-done { font-weight: 600; }

.week { display: flex; gap: 6px; margin: 18px 0; }
.day { flex: 1; display: grid; justify-items: center; gap: 6px; padding: 10px 0 8px; border-radius: 14px; font-size: 11px; font-weight: 600; color: var(--muted); }
.day i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.day.active i { background: var(--accent); }
.day.today { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--ink); }

.review-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--blue); border-radius: var(--r); padding: 18px 18px 18px 20px; transition: transform .12s; }
.review-card:active { transform: scale(.99); }
.review-card h2 { font-size: 22px; margin: 4px 0 2px; }
.review-card p { font-size: 14px; color: var(--tint-ink); }
.round-arrow { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--ink); display: grid; place-items: center; flex-shrink: 0; box-shadow: var(--shadow); }

.unit { background: var(--c); border-radius: 26px; padding: 20px 14px 14px; margin-bottom: 14px; }
.unit-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px; }
.unit-count { font-weight: 600; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface); color: var(--tint-ink); opacity: .85; }
.unit h2 { font-size: 28px; padding: 0 6px; margin-top: 6px; }
.unit-sub { font-size: 14px; padding: 2px 6px 14px; color: var(--tint-ink); }
.lesson-pills { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.lesson-pill {
  display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px 8px 8px; border-radius: 16px;
  background: color-mix(in srgb, var(--surface) 82%, transparent); color: var(--ink); font-weight: 500; font-size: 15px; line-height: 1.2; transition: transform .1s, background .15s;
}
a.lesson-pill:hover { background: var(--surface); }
a.lesson-pill:active { transform: scale(.99); }
.lesson-pill .num {
  width: 38px; height: 38px; border-radius: 12px; background: var(--c); color: var(--ink); flex-shrink: 0;
  display: grid; place-items: center; font-family: var(--serif); font-weight: 600; font-size: 18px;
}
.lesson-pill .num svg { width: 18px; height: 18px; }
.lesson-pill .name { flex: 1; }
.lesson-pill .meta { font-weight: 600; font-size: 13px; color: var(--muted); display: inline-flex; }
.lesson-pill .meta svg { width: 16px; height: 16px; }
.lesson-pill.done .num { background: var(--good-bg); color: var(--good); }
.lesson-pill.current { background: var(--surface); box-shadow: var(--shadow-up); font-weight: 600; }
.lesson-pill.current .num { background: var(--accent); color: var(--surface); }
.lesson-pill.current .meta { color: var(--accent); }
.lesson-pill.locked { background: transparent; color: var(--tint-ink); opacity: .6; cursor: not-allowed; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 12%, transparent); }
.lesson-pill.locked .num { background: transparent; color: var(--tint-ink); }

/* ---------- barra inferior ---------- */
.tabbar {
  position: fixed; z-index: 20; bottom: calc(12px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
  width: min(calc(var(--col) - 32px), calc(100% - 24px)); display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-radius: 22px; padding: 6px; box-shadow: var(--shadow-up), inset 0 0 0 1px var(--line);
}
.tab { position: relative; display: grid; justify-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 16px; color: var(--muted); font-size: 11px; font-weight: 500; }
.tab svg { width: 20px; height: 20px; }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab .badge {
  position: absolute; top: 3px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--accent); color: var(--surface); font-size: 10px; font-weight: 700; display: grid; place-items: center;
}

/* ---------- boas-vindas ---------- */
.welcome { min-height: 100vh; min-height: 100dvh; padding: 28px 24px 32px; display: flex; flex-direction: column; gap: 16px; background: var(--hero-bg); color: var(--hero-ink); }
.welcome .logo small { color: var(--brass); }
.welcome h1 { font-size: 44px; margin-top: 64px; line-height: 1.05; font-weight: 500; }
.welcome p { font-size: 16px; color: rgba(243, 236, 223, .78); }
.welcome .field { color: var(--hero-ink); }
.welcome .field input[type="text"] { background: rgba(243, 236, 223, .08); color: var(--hero-ink); box-shadow: inset 0 0 0 1px rgba(243, 236, 223, .18); }
.welcome-actions { margin-top: auto; display: grid; gap: 10px; padding-top: 12px; }
.welcome .btn.primary { background: var(--hero-ink); color: #1f1c18; }
.welcome .btn.ghost { background: transparent; color: var(--hero-ink); box-shadow: inset 0 0 0 1px rgba(243, 236, 223, .3); }
.level-big { font-family: var(--serif); font-weight: 600; font-size: 60px; line-height: 1; color: var(--accent); }

/* ---------- lição ---------- */
.lesson { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.lesson-top { display: flex; align-items: center; gap: 8px; padding: 14px 16px 4px; }
.progress { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s cubic-bezier(.3, 1.2, .5, 1); }
.lesson-body { flex: 1; padding: 12px 20px 230px; }
.session-label { font-size: 12px; color: var(--muted); margin-bottom: 18px; letter-spacing: .04em; }
.step { animation: slidein .22s ease; }
@keyframes slidein { from { transform: translateX(12px); opacity: 0; } }

.eyebrow { display: inline-block; padding: 0; margin-bottom: 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--brass); background: none; }
.question { font-size: 28px; font-weight: 600; line-height: 1.2; margin-bottom: 22px; }
.question strong { font-weight: 700; color: var(--accent); }

.options { display: grid; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
  padding: 15px 16px; border-radius: 16px; background: var(--surface); color: var(--ink); border: 0; box-shadow: inset 0 0 0 1px var(--line);
  font-size: 16px; line-height: 1.3; transition: transform .08s, background .12s, box-shadow .12s;
}
.option:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--muted); }
.option:active:not(:disabled) { transform: scale(.99); }
.option .key { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; background: var(--surface-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
.option.selected { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.option.selected .key { background: var(--accent); color: var(--surface); }
.option.correct { background: var(--good-bg); box-shadow: inset 0 0 0 1.5px var(--good); }
.option.correct .key { background: var(--good); color: var(--surface); }
.option.wrong { background: var(--bad-bg); box-shadow: inset 0 0 0 1.5px var(--bad); }
.option.wrong .key { background: var(--bad); color: var(--surface); }
.option:disabled { cursor: default; }
.options.chips { grid-template-columns: 1fr 1fr; }
.options.chips .option { font-family: var(--clause); font-size: 17px; }

.clause {
  margin: 0 0 22px; padding: 20px; background: var(--surface); border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line);
  font-family: var(--clause); font-size: 19px; line-height: 1.6; border-left: 3px solid var(--brass);
}
.blank { display: inline-block; min-width: 90px; border-bottom: 1.5px solid var(--muted); text-align: center; font-weight: 600; padding: 0 6px; }
.blank.filled { color: var(--accent); border-color: var(--accent); }

.prompt-box {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px;
  padding: 20px; background: var(--c); border-radius: var(--r); font-family: var(--serif); font-weight: 600; font-size: 23px; line-height: 1.3;
}
.answer {
  width: 100%; padding: 16px 18px; border: 0; border-radius: 16px; background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 17px; line-height: 1.5; resize: vertical; min-height: 110px;
}
.answer:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--accent); }

.term-card { background: var(--c); border-radius: 24px; padding: 22px; display: grid; gap: 12px; }
.term-top { display: flex; align-items: center; justify-content: space-between; }
.term-top .chip.ink { background: transparent; color: var(--brass); padding: 0; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
.term-en { font-size: 44px; font-weight: 600; line-height: 1; word-break: break-word; }
.term-pt { font-family: var(--serif); font-style: italic; font-size: 24px; line-height: 1.15; color: var(--tint-ink); }
.term-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

// Elle — correção de respostas digitadas (traduções)
window.Elle = window.Elle || {};

(function (E) {
  function stripAccents(s) {
    return s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function normalize(s) {
    return stripAccents(String(s).toLowerCase())
      .replace(/[‘’`´]/g, "'")
      .replace(/[“”"]/g, " ")
      .replace(/[-–—]/g, " ")
      .replace(/[.,;:!?()]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  // "a [b|c] d" -> ["a b d", "a c d"]; "[x |]y" -> ["x y", "y"]
  function expand(pattern) {
    const m = pattern.match(/\[([^\[\]]*)\]/);
    if (!m) return [pattern];
    const before = pattern.slice(0, m.index);
    const after = pattern.slice(m.index + m[0].length);
    const out = [];
    for (const alt of m[1].split("|")) out.push(...expand(before + alt + after));
    return out;
  }

  function levenshtein(a, b) {
    if (a === b) return 0;
    const prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      let diag = prev[0];
      prev[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = prev[j];
        prev[j] = Math.min(prev[j] + 1, prev[j - 1] + 1, diag + (a[i - 1] === b[j - 1] ? 0 : 1));
        diag = tmp;
      }
    }
    return prev[b.length];
  }

  /**
   * Compara a resposta com os padrões aceitos.
   * Retorna { result: "correct" | "typo" | "wrong" }.
   * "typo" = pequeno erro de digitação (conta como certo, com aviso).
   */
  function gradeText(input, patterns, extraAccepted) {
    const user = normalize(input || "");
    if (!user) return { result: "wrong" };
    const accepted = patterns.flatMap(expand).concat(extraAccepted || []).map(normalize);
    if (accepted.includes(user)) return { result: "correct" };

    if (accepted.some((a) => isTypoOf(user, a))) return { result: "typo" };
    return { result: "wrong" };
  }

  // Erro de digitação = mesmas palavras, no máximo 2 palavras com 1 letra trocada
  // (2 letras em palavras longas). Assim "pretends" não passa por "intends".
  function isTypoOf(user, target) {
    const u = user.split(" ");
    const t = target.split(" ");
    if (u.length !== t.length) return false;
    let wordsOff = 0;
    for (let i = 0; i < u.length; i++) {
      if (u[i] === t[i]) continue;
      const d = levenshtein(u[i], t[i]);
      const limit = t[i].length >= 8 ? 2 : t[i].length >= 4 ? 1 : 0;
      if (d > limit) return false;
      wordsOff++;
    }
    return wordsOff > 0 && wordsOff <= 2;
  }

  // Fala: fração das palavras da frase-alvo que foram reconhecidas (0 a 1).
  // Palavras quase iguais (1 letra de diferença) também contam.
  function speechScore(transcript, target) {
    const said = normalize(transcript).split(" ").filter(Boolean);
    const want = normalize(target).split(" ").filter(Boolean);
    if (!want.length) return 0;
    let hits = 0;
    want.forEach((w) => {
      const i = said.findIndex((s) => s === w || (w.length >= 5 && levenshtein(s, w) <= 1));
      if (i >= 0) { hits++; said.splice(i, 1); }
    });
    return hits / want.length;
  }

  E.grading = { normalize, expand, levenshtein, gradeText, speechScore };
})(window.Elle);

    return new Date(y, m - 1, d);
  }
  const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);
  function addDays(key, n) {
    const d = parseDay(key);
    d.setDate(d.getDate() + n);
    return dayKey(d);
  }
  // Semana ISO, ex.: "2026-W47"
  function weekKey(key) {
    const t = parseDay(key);
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + 3);
    const jan4 = new Date(t.getFullYear(), 0, 4);
    const week = 1 + Math.round(((t - jan4) / 86400000 - 3 + ((jan4.getDay() + 6) % 7)) / 7);
    return `${t.getFullYear()}-W${String(week).padStart(2, "0")}`;
  }

  // ---------- streak (funções puras) ----------
  // Um "congelamento" grátis por semana cobre UM dia perdido.
  function applyActivity(streak, today) {
    const s = Object.assign({ count: 0, last: null, freezeWeek: null }, streak);
    if (s.last === today) return s;
    if (!s.last) return Object.assign(s, { count: 1, last: today });
    const gap = daysBetween(s.last, today);
    if (gap <= 0) return s;
    if (gap === 1) return Object.assign(s, { count: s.count + 1, last: today });
    const missed = addDays(today, -1);
    if (gap === 2 && s.freezeWeek !== weekKey(missed)) {
      return Object.assign(s, { count: s.count + 1, last: today, freezeWeek: weekKey(missed) });
    }
    return Object.assign(s, { count: 1, last: today });
  }
  function displayStreak(streak, today) {
    if (!streak || !streak.last) return 0;
    const gap = daysBetween(streak.last, today);
    if (gap <= 1) return streak.count;
    if (gap === 2 && streak.freezeWeek !== weekKey(addDays(today, -1))) return streak.count;
    return 0;
  }

  // ---------- repetição espaçada (SM-2 simplificado, função pura) ----------
  // Acertou: 1 dia → 3 dias → intervalo × facilidade. Errou: volta para hoje.
  function srsNext(item, correct, today) {
    const it = Object.assign({ reps: 0, interval: 0, ease: 2.5, lapses: 0 }, item);
    if (correct) {
      it.reps += 1;
      it.interval = it.reps === 1 ? 1 : it.reps === 2 ? 3 : Math.round(it.interval * it.ease);
      it.ease = Math.min(3, it.ease + 0.05);
    } else {
      it.reps = 0;
      it.lapses += 1;
      it.interval = 0;
      it.ease = Math.max(1.3, it.ease - 0.2);
    }
    it.due = addDays(today, it.interval);
    it.last = today;
    return it;
  }

  // ---------- XP ----------
  const XP = { firstTry: 2, retry: 1, lessonDone: 10, reviewDone: 5, perfect: 5 };

  // ---------- estado ----------
  function emptyState() {
    return {
      version: 2,
      onboarded: false,
      xp: 0,
      xpByDay: {},
      streak: { count: 0, last: null, freezeWeek: null },
      lessons: {},     // { [lessonId]: { completed, times, bestAccuracy, lastAt } }
      seenTerms: {},   // { [termId]: true }
      srs: {},         // { [itemId]: { reps, interval, ease, lapses, due, last } }
      placement: null, // { openUnits, level, date }
      accepted: {},    // { [exerciseId]: [respostas marcadas como certas pela usuária] }
      settings: { accent: "en-US", voiceName: null, rate: 0.95, dictation: true, speaking: true, name: "", theme: "auto" }
    };
  }

  function migrate(s) {
    // v1 → v2: erros antigos viram itens de revisão para hoje
    if (s.mistakes && !Object.keys(s.srs || {}).length) {
      s.srs = {};
      Object.keys(s.mistakes).forEach((id) => { s.srs[id] = srsNext(null, false, dayKey()); });
    }
    delete s.mistakes;
    if (s.settings && s.settings.voice && !s.settings.accent) s.settings.accent = s.settings.voice;
    if (s.settings) delete s.settings.voice;
    if (s.version === 1 && Object.keys(s.lessons || {}).length) s.onboarded = true;
    s.version = 2;
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      const base = emptyState();
      const parsed = JSON.parse(raw);
      const s = Object.assign(base, parsed, { settings: Object.assign(base.settings, parsed.settings) });
      return migrate(s);
    } catch (e) {
      console.warn("Elle: não consegui ler o progresso salvo", e);
      return emptyState();
    }
  }

  let state = load();
  const changeListeners = [];

  function save(opts) {
    state.updatedAt = new Date().toISOString();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn("Elle: não consegui salvar o progresso", e); }
    if (!(opts && opts.silent)) changeListeners.forEach((fn) => { try { fn(); } catch (err) { console.warn(err); } });
  }

  // Usado pela sincronização: troca o estado inteiro pelo estado mesclado.
  function replace(next, opts) {
    const base = emptyState();
    state = migrate(Object.assign(base, next, { settings: Object.assign(base.settings, next && next.settings) }));
    const keepStamp = state.updatedAt;
    save(opts);
    if (keepStamp) { state.updatedAt = keepStamp; localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  }

  function srsReview(itemId, correct) {
    if (!itemId) return;
    state.srs[itemId] = srsNext(state.srs[itemId], correct, dayKey());
    save();
  }
  function dueItems(today) {
    const t = today || dayKey();
    return Object.entries(state.srs)
      .filter(([, it]) => it.due <= t)
      .sort((a, b) => (a[1].due < b[1].due ? -1 : a[1].due > b[1].due ? 1 : b[1].lapses - a[1].lapses))
      .map(([id]) => id);
  }
  function forgetItem(id) { delete state.srs[id]; save(); }

  function markSeen(termId) { state.seenTerms[termId] = true; }
  function acceptAnswer(exId, answer) {
    (state.accepted[exId] = state.accepted[exId] || []).push(answer);
    save();
  }

  function addXpAndStreak(xp) {
    const today = dayKey();
    state.xp += xp;
    state.xpByDay[today] = (state.xpByDay[today] || 0) + xp;
    state.streak = applyActivity(state.streak, today);
  }

  function completeLesson(lessonId, { xpEarned, correct, total }) {
    const accuracy = total ? Math.round((correct / total) * 100) : 100;
    const l = state.lessons[lessonId] || { completed: false, times: 0, bestAccuracy: 0 };
    l.completed = true;
    l.times += 1;
    l.bestAccuracy = Math.max(l.bestAccuracy, accuracy);
    l.lastAt = new Date().toISOString();
    state.lessons[lessonId] = l;
    addXpAndStreak(xpEarned);
    save();
    return { xpEarned, accuracy, streak: state.streak.count };
  }

  function completeReview({ xpEarned, correct, total }) {
    addXpAndStreak(xpEarned);
    save();
    return { xpEarned, accuracy: total ? Math.round((correct / total) * 100) : 100, streak: state.streak.count };
  }

  function setPlacement(p) { state.placement = p; state.onboarded = true; save(); }
  function setOnboarded() { state.onboarded = true; save(); }
  function setSetting(k, v) { state.settings[k] = v; save(); }

  function exportJSON() { return JSON.stringify(state, null, 2); }
  function importJSON(text) {
    const parsed = JSON.parse(text);
    if (typeof parsed !== "object" || parsed === null || !("xp" in parsed)) throw new Error("Arquivo não parece um backup do NICE.");
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    state = load();
    save();
  }
  function reset() { state = emptyState(); save(); }

  E.store = {
    get state() { return state; },
    save, replace, onChange: (fn) => changeListeners.push(fn), srsReview, dueItems, forgetItem, markSeen, acceptAnswer,
    completeLesson, completeReview, setPlacement, setOnboarded, setSetting,
    exportJSON, importJSON, reset, XP
  };
  E.dates = { dayKey, daysBetween, addDays, weekKey };
  E.streak = { applyActivity, displayStreak };
  E.srs = { next: srsNext };
})(window.Elle);

</script>

Elle.TR = (id, dir, prompt, display, answers, explanation) =>
  ({ id, type: "translate", dir, prompt, display, answers: [].concat(answers), explanation });

// Elle — voz feminina em inglês (Web Speech API, grátis no navegador)
window.Elle = window.Elle || {};

(function (E) {
  const supported = "speechSynthesis" in window;
  // Nomes de vozes femininas comuns no Windows, Edge, Chrome, macOS e Android
  const FEMALE = /\b(aria|jenny|zira|michelle|emma|ava|sara|samantha|victoria|karen|moira|tessa|fiona|serena|libby|sonia|hazel|maisie|susan|catherine|natasha|clara|nancy|jane|amber|ashley|cora|elizabeth|monica|joanna|kendra|kimberly|salli|amy|ivy|olivia|female|woman)\b|google us english|google uk english female/i;
  const MALE = /\b(guy|david|mark|george|ryan|thomas|daniel|alex|fred|james|male|christopher|eric|roger|steffan|brian|davis|tony|jason|andrew|william|liam|oliver|matthew|joey|justin|kevin|russell)\b/i;

  let voices = [];
  const listeners = [];
  function refresh() {
    voices = supported ? speechSynthesis.getVoices() : [];
    listeners.forEach((fn) => fn());
  }
  if (supported) {
    refresh();
    speechSynthesis.addEventListener("voiceschanged", refresh);
  }

  const quality = (v) => (/natural|neural|online|premium|enhanced/i.test(v.name) ? 0 : /google/i.test(v.name) ? 1 : 2);

  function femaleVoices(accent) {
    const acc = (accent || "en-US").toLowerCase();
    const english = voices.filter((v) => v.lang.replace("_", "-").toLowerCase().startsWith(acc));
    const female = english.filter((v) => FEMALE.test(v.name) && !MALE.test(v.name));
    const neutral = english.filter((v) => !MALE.test(v.name) && !female.includes(v));
    return female.sort((a, b) => quality(a) - quality(b)).concat(neutral);
  }

  function chosen() {
    const s = E.store.state.settings;
    const list = femaleVoices(s.accent);
    return list.find((v) => v.name === s.voiceName) || list[0] || null;
  }

  function speak(text, opts) {
    if (!supported || !text) return;
    const s = E.store.state.settings;
    const u = new SpeechSynthesisUtterance(text);
    const v = chosen();
    if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = s.accent; u.pitch = 1.15; }
    u.rate = (opts && opts.rate) || s.rate;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // Há alguma voz em inglês para o ditado funcionar?
  const available = () => supported && voices.some((v) => v.lang.toLowerCase().startsWith("en"));

  E.voice = { supported, available, speak, femaleVoices, chosen, onChange: (fn) => listeners.push(fn) };

  // ---------- reconhecimento de fala (Chrome / Edge) ----------
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let active = null;
  function listen({ onResult, onError, onEnd }) {
    if (!Recognition) { onError("unsupported"); return; }
    if (active) active.abort();
    const r = new Recognition();
    r.lang = E.store.state.settings.accent;
    r.interimResults = false;
    r.maxAlternatives = 3;
    r.onresult = (e) => onResult([...e.results[0]].map((a) => a.transcript));
    r.onerror = (e) => onError(e.error);
    r.onend = () => { active = null; onEnd && onEnd(); };
    active = r;
    try { r.start(); } catch (err) { onError("start-failed"); }
  }
  E.listen = { supported: !!Recognition, start: listen, stop: () => active && active.stop() };
})(window.Elle);

    speaker: svg("M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"),
    flame: svg("M13.5 1s.7 2.6.7 4.7c0 2-1.3 3.7-3.3 3.7S7.4 7.7 7.4 5.7l.03-.36C5.45 7.7 4.2 10.7 4.2 14a7.8 7.8 0 0 0 15.6 0c0-5.1-2.4-9.6-6.3-13zM11.7 20c-1.7 0-3.1-1.3-3.1-3 0-1.6 1-2.7 2.8-3 1.8-.4 3.6-1.2 4.6-2.6.4 1.3.6 2.6.6 4 0 2.6-2.1 4.6-4.9 4.6z", 18),
    bolt: svg("M13 2 4 14h6l-1 8 9-12h-6l1-8z", 18),
    check: svg("M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"),
    lock: svg("M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z", 18),
    arrow: svg("M12 4l-1.4 1.4 5.6 5.6H4v2h12.2l-5.6 5.6L12 20l8-8z", 20),
    close: svg("M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z"),
    home: svg("M12 3 2 12h3v8h6v-6h2v6h6v-8h3z"),
    cards: svg("M4 6h12v14H4zm2 2v10h8V8zm12-4H7V2h13v15h-2z"),
    book: svg("M5 3h11a3 3 0 0 1 3 3v15H7a2 2 0 0 1-2-2zm2 2v12.2c.3-.1.6-.2 1-.2h9V6a1 1 0 0 0-1-1zm1 14a.5.5 0 0 0 0 1h9v-1z"),
    gear: svg("M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.8a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1L11 21h4l.4-2.8a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"),
    cloud: svg("M19.4 10A7.5 7.5 0 0 0 5.3 8.1 6 6 0 0 0 6 20h13a5 5 0 0 0 .4-10zM19 18H6a4 4 0 0 1-.4-8l1.1-.1.5-1A5.5 5.5 0 0 1 17.6 10l.3 1.5 1.5.1A3 3 0 0 1 19 18z", 18),
    back: svg("M15.4 7.4 14 6l-6 6 6 6 1.4-1.4-4.6-4.6z"),
    sparkle: svg("M12 2l1.8 5.4L19 9l-5.2 1.6L12 16l-1.8-5.4L5 9l5.2-1.6zm7 11 .9 2.6 2.1.9-2.1.9L19 21l-.9-2.6-2.1-.9 2.1-.9zM5 15l.7 1.8 1.8.7-1.8.7L5 20l-.7-1.8-1.8-.7 1.8-.7z"),
    mic: svg("M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9z", 30),
    turtle: svg("M12 6c-4 0-7 3-7.6 6H2v2h2.6l-1 3 1.9.7L7 15h10l1.5 2.7 1.9-.7-1-3H22v-2h-2.4C19 9 16 6 12 6z", 20),
    search: svg("M10 2a8 8 0 0 1 6.3 12.9l5.4 5.4-1.4 1.4-5.4-5.4A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z", 20)
  };

  const EQ = {
    direct: { icon: "✓", label: "Equivalente direto", fill: "var(--eq-direct)" },
    approx: { icon: "≈", label: "Equivalente aproximado", fill: "var(--eq-approx)" },
    none: { icon: "!", label: "Sem equivalente no Brasil", fill: "var(--eq-none)" }
  };
  const VARIANT = { US: "Inglês dos EUA", UK: "Inglês britânico" };
  const eqSticker = (eq) =>
    `<span class="eq-sticker" style="background:${EQ[eq].fill}"><b>${EQ[eq].icon}</b>${EQ[eq].label}</span>`;
  const eqDot = (eq) => `<span class="eq-dot" style="background:${EQ[eq].fill}" title="${EQ[eq].label}">${EQ[eq].icon}</span>`;
  const variantChip = (v) => (VARIANT[v] ? `<span class="chip outline">${VARIANT[v]}</span>` : "");
  const speakBtn = (text, small) =>
    `<button class="speak${small ? " small" : ""}" data-say="${esc(text)}" aria-label="Ouvir em inglês">${ICON.speaker}</button>`;
  function bindSpeak(root) {
    root.querySelectorAll("[data-say]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); E.voice.speak(b.dataset.say); }));
  }

  // ---------- tom: sala de conselho — sóbrio, confiante, humor seco ----------
  const HUMOR = {
    correct: [
      "Exato.", "Impecável. Pronto para o board.", "Preciso, como deve ser.", "Isso fecha negócio.",
      "Nada a acrescentar.", "Muito bem. Próximo item da pauta.", "Sem ressalvas."
    ],
    typo: ["Conteúdo certo. Ajuste a grafia antes de assinar.", "Certo, com um detalhe de ortografia."],
    wrong: [
      "Ainda não. Vale revisar.", "Quase. Nenhum acordo sai no primeiro draft.",
      "Não desta vez. Ela volta no fim da lição.", "Errar no treino custa menos do que errar na mesa."
    ],
    hero: [
      "Quem domina os termos conduz a mesa.",
      "Fluência é vantagem negocial.",
      "Cinco minutos hoje. Uma reunião mais segura amanhã.",
      "Em M&A, cada palavra tem preço.",
      "Prepare-se como quem vai negociar.",
      "Clareza é uma forma de poder."
    ],
    resultPerfect: ["Lição impecável.", "Sem ressalvas.", "Execução perfeita."],
    result: ["Lição concluída.", "Mais um passo. Constância é estratégia.", "Feito. É a regularidade que faz a diferença."],
    reviewEmpty: ["Nada pendente por hoje.", "Revisões em dia.", "Pauta limpa."],
    glossaryEmpty: "Nenhum termo encontrado.",
    footer: [
      "Quem domina os termos conduz a mesa.",
      "Inglês jurídico para quem senta à mesa de negociação.",
      "Constância vence talento.",
      "Clareza é uma forma de poder."
    ]
  };

  function greeting() {
    const name = ((E.store && E.store.state.settings.name) || "").trim();
    const h = new Date().getHours();
    const base = h < 5 ? "Trabalhando até tarde" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
    return `${base}${name ? `, ${name}` : ""}${h < 5 ? "?" : "."}`;
  }

  // Tema: automático (segue o celular), claro ou escuro
  function applyTheme() {
    const t = (E.store && E.store.state.settings.theme) || "auto";
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  // ---------- índice do conteúdo ----------
  let idx = null;
  function index() {
    if (idx) return idx;
    const terms = new Map();
    const exercises = new Map();
    E.units.forEach((unit, unitIndex) => unit.lessons.forEach((lesson) => {
      lesson.terms.forEach((term) => terms.set(term.id, { term, unit, lesson, unitIndex }));
      lesson.exercises.forEach((ex) => exercises.set(ex.id, { ex, unit, lesson, unitIndex }));
    }));
    return (idx = { terms, exercises });
  }

  const app = () => document.getElementById("app");

  // Diálogo próprio (alguns ambientes, como o link de teste, bloqueiam confirm/alert).
  function ask(message, { ok = "Confirmar", cancel = "Cancelar", danger = false } = {}) {
    return new Promise((resolve) => {
      const wrap = document.createElement("div");
      wrap.className = "dialog-wrap";
      wrap.innerHTML = `
        <div class="dialog" role="alertdialog" aria-modal="true" aria-label="${esc(message)}">
          <p>${esc(message)}</p>
          <div class="dialog-actions">
            <button class="btn ghost" data-v="0">${esc(cancel)}</button>
            <button class="btn ${danger ? "danger" : "primary"}" data-v="1">${esc(ok)}</button>
          </div>
        </div>`;
      const close = (v) => { wrap.remove(); document.removeEventListener("keydown", onKey, true); resolve(v); };
      const onKey = (e) => {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(false); }
        if (e.key === "Enter") { e.preventDefault(); e.stopPropagation(); close(true); }
      };
      wrap.onclick = (e) => {
        if (e.target === wrap) return close(false);
        const b = e.target.closest("[data-v]");
        if (b) close(b.dataset.v === "1");
      };
      document.addEventListener("keydown", onKey, true);
      document.body.appendChild(wrap);
      wrap.querySelector('[data-v="1"]').focus();
    });
  }

  function toast(message) {
    const t = document.createElement("div");
    t.className = "toast";
    t.setAttribute("role", "status");
    t.textContent = message;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add("out"), 3200);
    setTimeout(() => t.remove(), 3600);
  }

  E.ui = {
    esc, shuffle, pick, COLOR, unitColor, ICON, EQ, eqSticker, eqDot, variantChip,
    speakBtn, bindSpeak, HUMOR, greeting, applyTheme, index, app, ask, toast
  };
})(window.Elle);

</script>
  <script>
// Elle — motor de exercícios (usado por lições, revisão e nivelamento)
window.Elle = window.Elle || {};

(function (E) {
  const { esc, shuffle, pick, ICON, eqSticker, variantChip, speakBtn, bindSpeak, HUMOR, app } = E.ui;
  const { store, grading } = E;

  // ---------- construção de passos ----------
  let uidSeq = 0;
  const withUid = (s) => Object.assign(s, { uid: ++uidSeq });

  function termMcq(term, pool, dir) {
    const key = dir === "en-pt" ? "pt" : "en";
    const clash = (t) => t.id === term.id || t.pt === term.pt || t.en === term.en;
    const distractors = [];
    for (const t of pool) {
      if (distractors.length === 3) break;
      if (!clash(t) && !distractors.includes(t[key])) distractors.push(t[key]);
    }
    return withUid({
      kind: "mcq",
      itemId: term.id,
      questionHtml: dir === "en-pt"
        ? `O que significa <strong lang="en">${esc(term.en)}</strong>?`
        : `Como se diz <strong>${esc(term.pt)}</strong> em inglês?`,
      speakText: dir === "en-pt" ? term.en : null,
      options: [term[key]].concat(distractors),
      answer: term[key],
      explanation: `${term.en} = ${term.pt}`
    });
  }

  // Distratores: primeiro da mesma lição, depois da mesma unidade
  const poolFor = (lesson, unit) => shuffle(lesson.terms).concat(shuffle(unit.lessons.flatMap((l) => l.terms)));
  const exerciseStep = (ex) => withUid(Object.assign({}, ex, { kind: ex.type, itemId: ex.id }));

  function lessonSteps(unit, lesson) {
    const steps = [];
    const unseen = [];
    lesson.terms.forEach((t, i) => {
      if (!store.state.seenTerms[t.id]) {
        steps.push(withUid({ kind: "card", term: t }));
        unseen.push(t.id);
      }
      steps.push(termMcq(t, poolFor(lesson, unit), i % 2 === 0 ? "en-pt" : "pt-en"));
      if (i === 3) steps.push(withUid({ kind: "match", itemId: null, pairs: lesson.terms.slice(0, 4) }));
    });
    shuffle(lesson.exercises).forEach((ex) => steps.push(exerciseStep(ex)));

    // Áudio: frases de exemplo simples (sem números, aspas ou parênteses)
    const speakable = shuffle(lesson.terms.filter((t) => /^[A-Za-z ,.'’-]+$/.test(t.exEn) && t.exEn.split(" ").length >= 4));
    const set = store.state.settings;
    if (speakable[0] && set.dictation !== false && E.voice.available()) steps.push(dictationStep(speakable[0]));
    if (speakable[1] && set.speaking !== false && E.listen.supported) steps.push(speakStep(speakable[1]));
    return { steps, unseen };
  }

  const dictationStep = (t) => withUid({ kind: "dictation", itemId: t.id, text: t.exEn, explanation: `Tradução: ${t.exPt}` });
  const speakStep = (t) => withUid({ kind: "speak", itemId: null, text: t.exEn, explanation: `Tradução: ${t.exPt}` });

  function reviewSteps(ids) {
    const { terms, exercises } = E.ui.index();
    const steps = [];
    ids.forEach((id) => {
      if (terms.has(id)) {
        const { term, unit, lesson } = terms.get(id);
        steps.push(termMcq(term, poolFor(lesson, unit), Math.random() < 0.5 ? "en-pt" : "pt-en"));
      } else if (exercises.has(id)) {
        steps.push(exerciseStep(exercises.get(id).ex));
      } else {
        store.forgetItem(id); // item antigo que não existe mais
      }
    });
    return steps;
  }

  E.steps = { termMcq, poolFor, lessonSteps, reviewSteps, withUid, dictationStep, speakStep };

  // ---------- sessão ----------
  let S = null;
  const current = () => S && S.queue[S.index];

  function start(steps, cfg) {
    S = {
      cfg: Object.assign({ requeue: true, srs: true, xp: true, color: "var(--pink)", label: "" }, cfg),
      queue: steps.slice(),
      index: 0,
      attempts: {},
      questions: new Set(steps.filter((s) => s.kind !== "card").map((s) => s.uid)),
      firstTry: 0,
      xp: 0,
      ui: null,
      stop: false
    };
    renderStep();
  }

  function addSteps(steps) {
    steps.forEach((s) => { S.queue.push(s); if (s.kind !== "card") S.questions.add(s.uid); });
  }

  function renderStep() {
    const s = current();
    if (s.kind === "speak" && S.noSpeak) return skip();
    S.ui = { selected: null, checked: false, result: null, typed: "", heard: "" };
    const pct = Math.round((S.index / S.queue.length) * 100);
    app().innerHTML = `
      <div class="lesson" style="--c:${S.cfg.color}">
        <div class="lesson-top">
          <button class="icon-btn" id="quit" aria-label="Sair">${ICON.close}</button>
          <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" style="width:${Math.max(pct, 4)}%"></div>
          </div>
        </div>
        <main class="lesson-body" id="body"></main>
        <footer class="lesson-foot" id="foot"></footer>
      </div>`;
    document.getElementById("quit").onclick = () => {
      E.ui.ask("Sair agora? O progresso desta sessão não será salvo.", { ok: "Sair", cancel: "Continuar estudando" }).then((yes) => {
        if (!yes || !S) return;
        const cb = S.cfg.onQuit;
        S = null;
        cb ? cb() : (location.hash = "#/");
      });
    };
    const body = document.getElementById("body");
    if (S.cfg.label) body.insertAdjacentHTML("beforeend", `<p class="session-label">${esc(S.cfg.label)}</p>`);
    const wrap = document.createElement("div");
    wrap.className = "step";
    body.appendChild(wrap);
    ({
      card: renderCard, mcq: renderChoice, gap: renderChoice, translate: renderTranslate, match: renderMatch,
      error: renderError, dictation: renderDictation, speak: renderSpeak
    })[s.kind](s, wrap);
    bindSpeak(body);
    renderFoot();
    window.scrollTo(0, 0);
  }

  function renderCard(s, el) {
    const t = s.term;
    el.innerHTML = `
      <article class="term-card">
        <div class="term-top"><span class="chip ink">termo novo</span>${speakBtn(t.en)}</div>
        <h2 class="term-en" lang="en">${esc(t.en)}</h2>
        <p class="term-pt">${esc(t.pt)}</p>
        <div class="term-tags">${eqSticker(t.eq)}${variantChip(t.variant)}</div>
        <p class="term-notes">${esc(t.notes)}</p>
        <div class="example">
          <p lang="en">${esc(t.exEn)} ${speakBtn(t.exEn, true)}</p>
          <p class="example-pt">${esc(t.exPt)}</p>
        </div>
      </article>
      <p class="disclaimer">Correspondência didática; não substitui análise jurídica.</p>`;
    E.voice.speak(t.en);
  }

  function renderChoice(s, el) {
    const isGap = s.kind === "gap";
    const header = isGap
      ? `<p class="eyebrow">Complete a cláusula</p>
         <blockquote class="clause" lang="en">${esc(s.text).replace("___", '<span class="blank" id="blank">&nbsp;</span>')}</blockquote>`
      : `<p class="eyebrow">Escolha a resposta</p>
         <h2 class="question">${s.questionHtml || esc(s.question)} ${s.speakText ? speakBtn(s.speakText, true) : ""}</h2>`;
    el.innerHTML = header + `
      <div class="options${isGap ? " chips" : ""}">
        ${shuffle(s.options).map((o, i) => `<button class="option" data-value="${esc(o)}"><span class="key">${i + 1}</span><span ${isGap ? 'lang="en"' : ""}>${esc(o)}</span></button>`).join("")}
      </div>`;
    el.querySelectorAll(".option").forEach((b) => (b.onclick = () => selectOption(b.dataset.value)));
  }

  function selectOption(value) {
    if (S.ui.checked) return;
    S.ui.selected = value;
    document.querySelectorAll(".option").forEach((b) => b.classList.toggle("selected", b.dataset.value === value));
    const blank = document.getElementById("blank");
    if (blank) { blank.textContent = value; blank.classList.add("filled"); }
    renderFoot();
  }

  function renderTranslate(s, el) {
    const toEn = s.dir === "pt-en";
    el.innerHTML = `
      <p class="eyebrow">${toEn ? "Traduza para o inglês" : "Traduza para o português"}</p>
      <div class="prompt-box">
        <p ${toEn ? "" : 'lang="en"'}>${esc(s.prompt)}</p>
        ${toEn ? "" : speakBtn(s.prompt)}
      </div>
      <textarea id="answer" class="answer" rows="3" lang="${toEn ? "en" : "pt"}"
        placeholder="${toEn ? "Escreva em inglês…" : "Escreva em português…"}"
        autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`;
    const ta = el.querySelector("#answer");
    ta.oninput = () => { S.ui.typed = ta.value; renderFoot(); };
    setTimeout(() => ta.focus(), 0);
    if (!toEn) E.voice.speak(s.prompt);
  }

  function renderMatch(s, el) {
    el.innerHTML = `
      <p class="eyebrow">Associe os pares</p>
      <div class="match">
        <div class="col">${shuffle(s.pairs).map((t) => `<button class="tile" data-side="l" data-id="${t.id}" lang="en">${esc(t.en)}</button>`).join("")}</div>
        <div class="col">${shuffle(s.pairs).map((t) => `<button class="tile" data-side="r" data-id="${t.id}">${esc(t.pt)}</button>`).join("")}</div>
      </div>`;
    let pickL = null, pickR = null, done = 0, errors = 0;
    el.querySelectorAll(".tile").forEach((b) => (b.onclick = () => {
      if (b.classList.contains("matched")) return;
      const side = b.dataset.side;
      el.querySelectorAll(`.tile[data-side="${side}"]`).forEach((x) => x.classList.remove("selected"));
      b.classList.add("selected");
      if (side === "l") { pickL = b; E.voice.speak(b.textContent); } else pickR = b;
      if (!(pickL && pickR)) return;
      const L = pickL, R = pickR;
      pickL = pickR = null;
      if (L.dataset.id === R.dataset.id) {
        [L, R].forEach((x) => { x.classList.remove("selected"); x.classList.add("matched"); x.disabled = true; });
        if (++done === s.pairs.length) {
          S.ui.checked = true;
          S.ui.result = errors ? "partial" : "correct";
          renderFoot();
        }
      } else {
        errors++;
        if (S.cfg.srs) store.srsReview(L.dataset.id, false);
        [L, R].forEach((x) => {
          x.classList.remove("selected");
          x.classList.add("shake");
          setTimeout(() => x.classList.remove("shake"), 450);
        });
      }
    }));
  }

  function renderError(s, el) {
    el.innerHTML = `
      <p class="eyebrow">Ache o erro</p>
      <h2 class="question">Toque na palavra errada.</h2>
      <div class="clause tokens" lang="en">${s.tokens.map((t, i) => `<button class="tok" data-i="${i}">${esc(t)}</button>`).join(" ")}</div>`;
    el.querySelectorAll(".tok").forEach((b) => (b.onclick = () => {
      if (S.ui.checked) return;
      S.ui.selected = Number(b.dataset.i);
      el.querySelectorAll(".tok").forEach((x) => x.classList.toggle("selected", x === b));
      renderFoot();
    }));
  }

  function renderDictation(s, el) {
    el.innerHTML = `
      <p class="eyebrow">Ouça e escreva</p>
      <h2 class="question">Escreva o que você ouvir.</h2>
      <div class="listen-row">
        <button class="play" id="play">${ICON.speaker}<span>Ouvir</span></button>
        <button class="play slow" id="slow"><span>Devagar</span></button>
      </div>
      <textarea id="answer" class="answer" rows="3" lang="en" placeholder="Escreva em inglês…"
        autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>`;
    el.querySelector("#play").onclick = () => E.voice.speak(s.text);
    el.querySelector("#slow").onclick = () => E.voice.speak(s.text, { rate: 0.65 });
    const ta = el.querySelector("#answer");
    ta.oninput = () => { S.ui.typed = ta.value; renderFoot(); };
    setTimeout(() => ta.focus(), 0);
    E.voice.speak(s.text);
  }

  const MIC_ERRORS = {
    "not-allowed": "O navegador bloqueou o microfone. Libere o acesso no cadeado da barra de endereço, ou pule este exercício.",
    "service-not-allowed": "O navegador não permite reconhecimento de voz aqui. Pule este exercício.",
    "no-speech": "Não ouvi nada. Toque no microfone e tente de novo.",
    "audio-capture": "Não encontrei um microfone neste aparelho.",
    "network": "O reconhecimento de voz precisa de internet.",
    "unsupported": "Este navegador não tem reconhecimento de voz. Use Chrome ou Edge."
  };

  function renderSpeak(s, el) {
    el.innerHTML = `
      <p class="eyebrow">Fale em inglês</p>
      <h2 class="question">Leia em voz alta.</h2>
      <div class="prompt-box"><p lang="en">${esc(s.text)}</p>${speakBtn(s.text)}</div>

    S = null;

    if (e.key === "Enter" && !e.shiftKey) {

      const b = document.querySelectorAll(".option")[Number(e.key) - 1];
      if (b) b.click();
    }
  });

        client_id: clientId(),
        scope: SCOPE,
        callback: (r) => {
          if (r.error) { reject(new Error(r.error_description || "O Google recusou o acesso.")); return; }
          localStorage.setItem(TOK, JSON.stringify({ value: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000 }));
          resolve(r.access_token);
        },
        error_callback: (e) => reject(new Error(e && e.type === "popup_closed" ? "Login cancelado." : "Não consegui abrir o login do Google. O navegador bloqueou o popup?"))
      });
      client.requestAccessToken({ prompt: firstTime ? "consent" : "" });
    });
  }

  // ---------- Drive ----------
  class AuthNeeded extends Error { constructor() { super("Toque para entrar de novo com o Google."); this.code = "auth"; } }

  async function api(url, opts = {}) {
    const t = token();
    if (!t) throw new AuthNeeded();
    const res = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: `Bearer ${t}` }, opts.headers || {}) }));
    if (res.status === 401) { localStorage.removeItem(TOK); throw new AuthNeeded(); }
    if (!res.ok) throw new Error(`O Google Drive respondeu com erro (${res.status}).`);
    return res;
  }
  async function findFile() {
    const q = encodeURIComponent(`name='${FILE}'`);
    const r = await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`);
    return ((await r.json()).files || [])[0] || null;
  }
  async function download(id) {
    return (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();
  }
  async function upload(id, data) {
    const body = JSON.stringify(data);
    if (id) {
      await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
        method: "PATCH", headers: { "Content-Type": "application/json" }, body
      });
      return id;
    }
    const b = `nice${Date.now()}`;
    const multipart = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: FILE, parents: ["appDataFolder"] })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
    const r = await api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method: "POST", headers: { "Content-Type": `multipart/related; boundary=${b}` }, body: multipart
    });
    return (await r.json()).id;
  }

  // ---------- mesclagem: o mais recente vence, item por item (função pura) ----------
  const later = (x, y) => ((x || "") >= (y || "") ? x : y);
  function merge(a, b) {
    if (!b) return a;
    if (!a) return b;
    const out = JSON.parse(JSON.stringify(a));
    const keys = (x, y) => [...new Set([...Object.keys(x || {}), ...Object.keys(y || {})])];

    out.xpByDay = {};
    keys(a.xpByDay, b.xpByDay).forEach((d) => (out.xpByDay[d] = Math.max((a.xpByDay || {})[d] || 0, (b.xpByDay || {})[d] || 0)));
    const sum = Object.values(out.xpByDay).reduce((s, v) => s + v, 0);
    out.xp = Math.max(a.xp || 0, b.xp || 0, sum);

    const sa = a.streak || {}, sb = b.streak || {};
    out.streak = (sb.last || "") > (sa.last || "") ? Object.assign({}, sb)
      : sa.last === sb.last && (sb.count || 0) > (sa.count || 0) ? Object.assign({}, sb) : Object.assign({}, sa);

    out.lessons = {};
    keys(a.lessons, b.lessons).forEach((id) => {
      const x = (a.lessons || {})[id] || {}, y = (b.lessons || {})[id] || {};
      out.lessons[id] = {
        completed: !!(x.completed || y.completed),
        times: Math.max(x.times || 0, y.times || 0),
        bestAccuracy: Math.max(x.bestAccuracy || 0, y.bestAccuracy || 0),
        lastAt: later(x.lastAt, y.lastAt)
      };
    });

    out.seenTerms = Object.assign({}, b.seenTerms, a.seenTerms);

    out.srs = {};
    keys(a.srs, b.srs).forEach((id) => {
      const x = (a.srs || {})[id], y = (b.srs || {})[id];
      if (!x || !y) { out.srs[id] = Object.assign({}, x || y); return; }
      const pickY = (y.last || "") > (x.last || "") || (y.last === x.last && (y.reps || 0) > (x.reps || 0));
      out.srs[id] = Object.assign({}, pickY ? y : x);
    });

    out.accepted = {};
    keys(a.accepted, b.accepted).forEach((id) => {
      out.accepted[id] = [...new Set([...((a.accepted || {})[id] || []), ...((b.accepted || {})[id] || [])])];
    });

    const pa = a.placement, pb = b.placement;
    out.placement = pa && pb ? ((pb.date || "") > (pa.date || "") ? pb : pa) : pa || pb || null;
    out.onboarded = !!(a.onboarded || b.onboarded);
    out.settings = (b.updatedAt || "") > (a.updatedAt || "")
      ? Object.assign({}, a.settings, b.settings) : Object.assign({}, b.settings, a.settings);
    out.updatedAt = later(a.updatedAt, b.updatedAt);
    return out;
  }

  // ---------- sincronizar ----------
  let running = null;
  // force = sobrescreve o Drive com o estado local (usado ao zerar o progresso)
  function sync(force) {
    if (running) return running;
    running = (async () => {
      setStatus("syncing");
      try {
        const f = await findFile();
        const remote = f && !force ? await download(f.id) : null;
        let changed = false;
        if (remote && remote.state) {
          const before = JSON.stringify(E.store.state);
          E.store.replace(merge(E.store.state, remote.state), { silent: true });
          changed = before !== JSON.stringify(E.store.state);
          if (remote.aiKey && !E.ai.getKey()) {
            E.ai.setKey(remote.aiKey);
            if (remote.aiModel) E.ai.setModel(remote.aiModel);
            changed = true;
          }
        }
        await upload(f && f.id, {
          app: "nice", version: 1, updatedAt: new Date().toISOString(),
          state: E.store.state,
          aiKey: includeKey() ? E.ai.getKey() : "",
          aiModel: includeKey() ? localStorage.getItem("nice:aiModel") || "" : ""
        });
        setMeta({ lastSync: Date.now(), dirty: false });
        setStatus("ok");
        return { changed };
      } catch (e) {
        setStatus(e.code === "auth" ? "auth" : "error", e.message);
        throw e;
      } finally {
        running = null;
      }
    })();
    return running;
  }

  // Botão "Conectar" / pílula da nuvem: precisa vir de um clique.
  function connect() {
    return requestToken(!connected()).then(() => { setMeta({ connected: true }); return sync(); });
  }
  function syncNow() {
    return token() ? sync() : requestToken(false).then(sync);
  }
  function disconnect() {
    const t = token();
    if (t && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(t, () => {});
    localStorage.removeItem(TOK);
    setMeta({ connected: false, lastSync: null, dirty: false });
    setStatus("idle");
  }

  // Salvou algo? Sincroniza alguns segundos depois (se o login ainda estiver válido).
  let timer = null;
  function onLocalChange() {
    if (!connected()) return;
    setMeta({ dirty: true });
    if (!token()) { setStatus("auth"); return; }
    setStatus("dirty");
    clearTimeout(timer);
    timer = setTimeout(() => sync().catch(() => {}), 4000);
  }

  function init(onRemoteChange) {
    if (!available()) return;
    loadGis().catch(() => {});
    E.store.onChange(onLocalChange);
    if (!connected()) return;
    if (!token()) { setStatus("auth"); return; }
    sync().then((r) => { if (r && r.changed && onRemoteChange) onRemoteChange(); }).catch(() => {});
  }

  E.sync = {
    available, connected, includeKey, setIncludeKey: (v) => { setMeta({ includeKey: !!v }); onLocalChange(); },
    connect, syncNow, disconnect, init, merge,
    overwrite: () => (token() ? sync(true) : Promise.reject(new AuthNeeded())),
    status: () => status, error: () => lastError, lastSync: () => meta().lastSync || null,
    onStatus: (fn) => listeners.push(fn)
  };
})(window.Elle);

</script>
  <script>
// Elle — telas: Início, Revisar, Glossário, Ajustes, Nivelamento e Resultado
window.Elle = window.Elle || {};

(function (E) {
  const { esc, shuffle, pick, COLOR, unitColor, ICON, eqDot, variantChip, speakBtn, bindSpeak, HUMOR, greeting, index, app } = E.ui;
  const bigNum = (value, label, cls = "") => `<div class="big-num ${cls}"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;
  const { store } = E;
  const today = () => E.dates.dayKey();

  // ---------- regras de desbloqueio ----------
  const allLessons = () => E.units.flatMap((unit, unitIndex) => unit.lessons.map((lesson) => ({ unit, lesson, unitIndex })));
  const isDone = (id) => !!(store.state.lessons[id] && store.state.lessons[id].completed);
  const openUnits = () => (store.state.placement ? store.state.placement.openUnits : 0);

  function isUnlocked(lessonId) {
    const list = allLessons();
    const i = list.findIndex((x) => x.lesson.id === lessonId);
    if (i < 0) return false;
    const x = list[i];
    if (i === 0 || isDone(lessonId) || x.unitIndex < openUnits()) return true;
    if (isDone(list[i - 1].lesson.id)) return true;
    return x.unitIndex === openUnits() && x.unit.lessons[0] === x.lesson;
  }
  function nextLesson() {
    const list = allLessons();
    return list.find((x) => x.unitIndex >= openUnits() && !isDone(x.lesson.id) && isUnlocked(x.lesson.id))
      || list.find((x) => !isDone(x.lesson.id) && isUnlocked(x.lesson.id)) || null;
  }

  // ---------- barra de navegação ----------
  function tabbar(active) {
    const due = store.dueItems().length;
    const tab = (id, href, icon, label, badge) =>
      `<a class="tab ${active === id ? "active" : ""}" href="${href}" ${active === id ? 'aria-current="page"' : ""}>
        ${icon}<span>${label}</span>${badge ? `<b class="badge">${badge > 99 ? "99+" : badge}</b>` : ""}</a>`;
    return `<nav class="tabbar" aria-label="Navegação">
      ${tab("home", "#/", ICON.home, "Início")}
      ${tab("review", "#/review", ICON.cards, "Revisar", due)}
      ${tab("studio", "#/studio", ICON.sparkle, "Estúdio")}
      ${tab("glossary", "#/glossary", ICON.book, "Glossário")}
      ${tab("settings", "#/settings", ICON.gear, "Ajustes")}
    </nav>`;
  }

  const logo = () => `<div class="logo" aria-label="NICE, Legal English"><b>NICE</b><small>Legal English</small></div>`;

  // Pílula da nuvem: só aparece com o Google Drive conectado.
  const CLOUD = {
    ok: ["ok", "Sincronizado com o Google Drive"],
    idle: ["ok", "Sincronizado com o Google Drive"],
    syncing: ["busy", "Sincronizando…"],
    dirty: ["busy", "Alterações a sincronizar"],
    auth: ["warn", "Toque para entrar com o Google e sincronizar"],
    error: ["warn", "Erro ao sincronizar. Toque para tentar de novo"]
  };
  function cloudPill() {
    if (!E.sync || !E.sync.available() || !E.sync.connected()) return "";
    const [cls, label] = CLOUD[E.sync.status()] || CLOUD.ok;
    return `<button class="pill cloud ${cls}" data-sync title="${label}" aria-label="${label}">${ICON.cloud}</button>`;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-sync]");
    if (!b) return;
    E.sync.syncNow().then((r) => { if (r && r.changed) E.app.refreshIfIdle(); })
      .catch((err) => E.ui.toast(err.message));
  });

  function topbar() {
    const st = store.state;
    const streak = E.streak.displayStreak(st.streak, today());
    return `<header class="topbar">
      ${logo()}
      <div class="pills">
        ${cloudPill()}
        <span class="pill ${streak ? "hot" : ""}" title="Dias seguidos estudando">${ICON.flame}${streak}</span>
        <span class="pill" title="XP total">${ICON.bolt}${st.xp}</span>
      </div>
    </header>`;
  }

  // ---------- Início ----------
  function home() {
    if (!store.state.onboarded) return placementIntro(true);
    const st = store.state;
    const t = today();
    const streak = E.streak.displayStreak(st.streak, t);
    const letters = ["D", "S", "T", "Q", "Q", "S", "S"];
    const week = [...Array(7)].map((_, i) => E.dates.addDays(t, i - 6));
    const nl = nextLesson();
    const due = store.dueItems().length;

    const units = E.units.map((u, ui) => {
      const doneCount = u.lessons.filter((l) => isDone(l.id)).length;
      const pills = u.lessons.map((l, i) => {
        const done = isDone(l.id), open = isUnlocked(l.id), cur = nl && nl.lesson.id === l.id;
        const cls = done ? "done" : cur ? "current" : open ? "open" : "locked";
        const meta = done ? `<span class="meta">${st.lessons[l.id].bestAccuracy}%</span>` : !open ? `<span class="meta">${ICON.lock}</span>` : cur ? `<span class="meta">${ICON.arrow}</span>` : "";
        const inner = `<span class="num">${done ? ICON.check : i + 1}</span><span class="name">${esc(l.title)}</span>${meta}`;
        return `<li>${open ? `<a class="lesson-pill ${cls}" href="#/lesson/${l.id}">${inner}</a>` : `<span class="lesson-pill locked" aria-disabled="true">${inner}</span>`}</li>`;
      }).join("");
      return `
        <section class="unit" style="--c:${unitColor(u)}">
          <div class="unit-head">
            <span class="kicker">Unidade ${ui + 1}</span>
            <span class="unit-count">${doneCount}/${u.lessons.length}</span>
          </div>
          <h2>${esc(u.title)}</h2>
          <p class="unit-sub">${esc(u.subtitle)}</p>
          <ol class="lesson-pills">${pills}</ol>
        </section>`;
    }).join("");

    app().innerHTML = `
      <div class="screen home">
        ${topbar()}
        <section class="hero">
          <p class="hero-hi">${esc(greeting())}</p>
          <h1 class="hero-title">${esc(pick(HUMOR.hero))}</h1>
          <p class="hero-xp">Hoje: <strong>${st.xpByDay[t] || 0} XP</strong></p>
          ${nl ? `<a class="btn primary wide" href="#/lesson/${nl.lesson.id}">${isDone(nl.lesson.id) ? "Praticar" : "Continuar"}: ${esc(nl.lesson.title)} ${ICON.arrow}</a>`
               : `<p class="all-done">Você zerou o NICE. Literalmente. Repita qualquer lição para manter o ritmo.</p>`}
        </section>

        <div class="week" aria-label="Últimos 7 dias">
          ${week.map((d) => `<span class="day ${st.xpByDay[d] ? "active" : ""} ${d === t ? "today" : ""}"><i></i>${letters[new Date(d + "T12:00").getDay()]}</span>`).join("")}
        </div>

        <a class="review-card" href="#/review">
          <div>
            <span class="kicker">Revisão do dia</span>
            <h2>${due ? `${due} ${due === 1 ? "item" : "itens"} esperando` : "Tudo em dia"}</h2>
            <p>${due ? "Os termos que você errou voltam aqui até grudar." : esc(pick(HUMOR.reviewEmpty))}</p>
          </div>
          <span class="round-arrow">${ICON.arrow}</span>
        </a>

        <h2 class="section-title">Sua trilha <em>jurídica</em></h2>
        ${units}
        ${E.config.persistent ? "" : `<p class="note center">Este navegador não deixou o NICE salvar dados: o progresso some ao fechar a página.</p>`}
        <p class="footer-quote">${esc(pick(HUMOR.footer))}</p>
      </div>
      ${tabbar("home")}`;
  }

  // ---------- Lição ----------
  function lesson(lessonId) {
    const found = allLessons().find((x) => x.lesson.id === lessonId);
    if (!found || !isUnlocked(lessonId)) { location.hash = "#/"; return; }
    const { unit, lesson: l, unitIndex } = found;
    const { steps, unseen } = E.steps.lessonSteps(unit, l);
    E.runner.start(steps, {
      color: unitColor(unit),
      label: `Unidade ${unitIndex + 1} · ${l.title}`,
      onFinish: (sum) => {
        unseen.forEach((id) => store.markSeen(id));
        const xp = sum.xp + store.XP.lessonDone + (sum.perfect ? store.XP.perfect : 0);
        const res = store.completeLesson(l.id, { xpEarned: xp, correct: sum.correct, total: sum.total });
        result({
          color: unitColor(unit), perfect: sum.perfect, subtitle: l.title, ...res,
          again: () => lesson(l.id),
          extraHref: `#/studio/practice/${l.id}`
        });
      }
    });
  }

  // ---------- Resultado ----------
  function result({ color, perfect, subtitle, xpEarned, accuracy, streak, again, title, extraHref }) {
    app().innerHTML = `
      <div class="result" style="--c:${color}">
        ${bigNum(`+${xpEarned}`, "XP", "result-num")}
        <h1>${esc(title || pick(perfect ? HUMOR.resultPerfect : HUMOR.result))}</h1>
        <p class="result-sub">${esc(subtitle)}</p>
        <div class="stats">
          <span class="stat"><b>${accuracy}%</b>precisão</span>
          <span class="stat"><b>${streak}</b>${streak === 1 ? "dia seguido" : "dias seguidos"}</span>
        </div>
        <div class="result-actions">
          <button class="btn primary wide" id="result-continue" data-enter>Continuar ${ICON.arrow}</button>
          ${extraHref && E.ai.configured() ? `<a class="btn ghost wide" href="${extraHref}">${ICON.sparkle} Mais prática com IA</a>` : ""}
          ${again ? `<button class="btn ghost wide" id="again">Repetir</button>` : ""}
        </div>
      </div>`;
    document.getElementById("result-continue").onclick = () => { if (location.hash === "#/") home(); else location.hash = "#/"; };
    if (again) document.getElementById("again").onclick = again;
  }

  // ---------- Revisar ----------
  function review() {
    const due = store.dueItems();
    const total = Object.keys(store.state.srs).length;
    const tomorrow = Object.values(store.state.srs).filter((it) => it.due === E.dates.addDays(today(), 1)).length;
    app().innerHTML = `
      <div class="screen">
        ${topbar()}
        <h1 class="page-title">Revisar <em>com carinho</em></h1>
        <p class="page-sub">Repetição espaçada: o que você erra volta logo; o que você acerta volta cada vez mais tarde.</p>
        <section class="review-hero ${due.length ? "" : "empty"}">
          ${bigNum(String(due.length), due.length === 1 ? "item" : "itens")}
          <h2>${due.length ? "Hora de revisar" : esc(pick(HUMOR.reviewEmpty))}</h2>
          <p>${due.length ? `Uma rodada tem até 15 itens. Leva uns 3 minutos.` : tomorrow ? `Amanhã voltam ${tomorrow} ${tomorrow === 1 ? "item" : "itens"}.` : "Faça uma lição nova para alimentar a revisão."}</p>
          ${due.length ? `<a class="btn primary wide" href="#/review/start">Começar revisão ${ICON.arrow}</a>` : `<a class="btn ghost wide" href="#/">Ir para a trilha</a>`}
        </section>
        <div class="mini-stats">
          <span><b>${total}</b>itens na memória</span>
          <span><b>${Object.values(store.state.srs).filter((it) => it.interval >= 21).length}</b>já dominados</span>
        </div>
      </div>
      ${tabbar("review")}`;
  }

  function reviewStart() {
    const steps = E.steps.reviewSteps(shuffle(store.dueItems().slice(0, 15)));
    if (!steps.length) { location.hash = "#/review"; return; }
    E.runner.start(steps, {
      color: "var(--blue)",
      label: "Revisão",
      onQuit: () => (location.hash = "#/review"),
      onFinish: (sum) => {
        const xp = sum.xp + store.XP.reviewDone + (sum.perfect ? store.XP.perfect : 0);
        const res = store.completeReview({ xpEarned: xp, correct: sum.correct, total: sum.total });
        result({ color: "var(--blue)", perfect: sum.perfect, subtitle: "Revisão concluída", ...res });
      }
    });
  }

  // ---------- Glossário ----------
  const gloss = { q: "", eq: "all", unit: "all" };

  function glossary() {
    app().innerHTML = `
      <div class="screen">
        ${topbar()}
        <h1 class="page-title">Glossário <em>de bolso</em></h1>
        <label class="search">${ICON.search}<input id="gq" type="search" placeholder="Buscar em inglês ou português" value="${esc(gloss.q)}" autocomplete="off"></label>
        <div class="filters" id="geq">
          ${[["all", "Todos"], ["direct", "✓ Direto"], ["approx", "≈ Aproximado"], ["none", "! Sem equivalente"]]
            .map(([k, l]) => `<button class="chip ${gloss.eq === k ? "ink" : "outline"}" data-eq="${k}">${l}</button>`).join("")}
        </div>
        <div class="filters" id="gunit">
          <button class="chip ${gloss.unit === "all" ? "ink" : "outline"}" data-unit="all">Todas</button>
          ${E.units.map((u, i) => `<button class="chip ${gloss.unit === u.id ? "ink" : "outline"}" data-unit="${u.id}" style="--c:${unitColor(u)}"><i class="dot"></i>${i + 1}. ${esc(u.title)}</button>`).join("")}
        </div>
        <div id="glist"></div>
      </div>
      ${tabbar("glossary")}`;
    const input = document.getElementById("gq");
    input.oninput = () => { gloss.q = input.value; renderGlossList(); };
    document.querySelectorAll("[data-eq]").forEach((b) => (b.onclick = () => { gloss.eq = b.dataset.eq; glossary(); }));
    document.querySelectorAll("[data-unit]").forEach((b) => (b.onclick = () => { gloss.unit = b.dataset.unit; glossary(); }));
    renderGlossList();
  }

  function renderGlossList() {
    const q = E.grading.normalize(gloss.q);
    const items = [...index().terms.values()].filter(({ term, unit }) =>
      (gloss.eq === "all" || term.eq === gloss.eq) &&
      (gloss.unit === "all" || unit.id === gloss.unit) &&
      (!q || E.grading.normalize(`${term.en} ${term.pt} ${term.notes}`).includes(q)));
    items.sort((a, b) => a.term.en.localeCompare(b.term.en, "en", { sensitivity: "base" }));
    const list = document.getElementById("glist");
    list.innerHTML = `<p class="count">${items.length} ${items.length === 1 ? "termo" : "termos"}</p>` + (items.length
      ? items.map(({ term: t, unit }) => `
        <details class="gloss-item" style="--c:${unitColor(unit)}">
          <summary>${eqDot(t.eq)}<span class="g-text"><b lang="en">${esc(t.en)}</b><span>${esc(t.pt)}</span></span>${store.state.seenTerms[t.id] ? "" : `<span class="chip tiny">novo</span>`}</summary>
          <div class="g-body">
            <div class="g-tags"><span class="chip" style="background:var(--c)">${esc(unit.title)}</span>${variantChip(t.variant)}</div>
            <p>${esc(t.notes)}</p>
            <div class="example"><p lang="en">${esc(t.exEn)} ${speakBtn(t.exEn, true)}</p><p class="example-pt">${esc(t.exPt)}</p></div>
          </div>
        </details>`).join("")
      : `<div class="empty-state"><p>${esc(HUMOR.glossaryEmpty)}</p></div>`);
    bindSpeak(list);
  }

  // ---------- Ajustes ----------
  function syncPanel() {
    if (!E.sync.available()) {

  const TIERS = [[0, 1], [2, 3], [4, 5]];

  function placementIntro(first) {

    document.getElementById("skip").onclick = () => {
      if (first) { store.setOnboarded(); home(); } else location.hash = "#/settings";
    };
  }

  function tierQuestions(tier) {
    const { terms } = index();
    const pool = [...terms.values()].filter((x) => TIERS[tier].includes(x.unitIndex));
    return shuffle(pool).slice(0, 5).map(({ term, unit, lesson: l }) =>
      Object.assign(E.steps.termMcq(term, E.steps.poolFor(l, unit), "en-pt"), { tier, itemId: null }));
  }

  function placementStart() {
    const results = [[], [], []];
    E.runner.start(tierQuestions(0), {
      color: "var(--lilac)",
      label: "Nivelamento",
      requeue: false,
      srs: false,
      onQuit: () => (location.hash = "#/"),
      afterAnswer: (step, correct, api) => {
        const r = results[step.tier];
        r.push(correct);
        if (r.length < 5) return;
        const passed = r.filter(Boolean).length >= 4;
        if (passed && step.tier < 2) api.addSteps(tierQuestions(step.tier + 1));
        else api.stop();
      },
      onFinish: () => {
        let passed = 0;
        while (passed < 3 && results[passed].length === 5 && results[passed].filter(Boolean).length >= 4) passed++;
        store.setPlacement({ openUnits: OPEN[passed], level: LEVELS[passed], passed, date: today() });
        const answered = results.flat();
        app().innerHTML = `
          <div class="result" style="--c:var(--lilac)">
            <p class="level-big">Nível ${passed + 1}</p>
            <h1>${passed === 0 ? "Começar do início é uma escolha estratégica." : passed === 3 ? "Você já chega à mesa preparada." : "Bom ponto de partida."}</h1>
            <p class="result-sub"><strong>Nível ${passed + 1} · ${LEVELS[passed]}.</strong> Você acertou ${answered.filter(Boolean).length} de ${answered.length}. ${OPEN[passed] ? `Liberamos as unidades 1 a ${Math.min(OPEN[passed], 6)}${OPEN[passed] < 6 ? `; sua trilha começa na Unidade ${OPEN[passed] + 1}` : ""}.` : "Sua trilha começa na Unidade 1."}</p>
            <div class="result-actions"><button class="btn primary wide" id="result-continue" data-enter>Bora! ${ICON.arrow}</button></div>
          </div>`;
        document.getElementById("result-continue").onclick = () => { if (location.hash === "#/") home(); else location.hash = "#/"; };
      }
    });
  }

  E.views = { topbar, tabbar, result, cloudPill, home, lesson, review, reviewStart, glossary, settings, placementIntro, placementStart, isUnlocked, nextLesson };
})(window.Elle);

  <script>

(function (E) {

  const LOADING = [
