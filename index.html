      <div class="screen">
        ${header("Plain English")}
        <p class="eyebrow" style="--c:var(--mint)">Reescreva em inglês claro</p>
        <blockquote class="clause" lang="en" style="--c:var(--mint)">${esc(c)} ${speakBtn(c, true)}</blockquote>
        <textarea id="pe" class="answer" rows="5" lang="en" placeholder="Sua versão em plain English…" spellcheck="true"></textarea>
        <div class="row-actions">
          <button class="btn ghost" id="other">Outra cláusula</button>
          <button class="btn primary" id="eval" disabled>Avaliar</button>
        </div>
        <div id="pe-out"></div>
      </div>`;
    bindSpeak(app());
    const ta = document.getElementById("pe");
    const btn = document.getElementById("eval");
    ta.oninput = () => (btn.disabled = ta.value.trim().length < 10);
    document.getElementById("other").onclick = () => plain(pick(CLAUSES.filter((x) => x !== c)));
    btn.onclick = () => {
      const out = document.getElementById("pe-out");
      btn.disabled = true;
      out.innerHTML = loading("Revisando sua versão…");
      E.ai.plainEnglish({ clause: c, answer: ta.value.trim() }).then((r) => {
        const bar = (label, v) => `<div class="score-row"><span>${label}</span><div class="score-bar"><i style="width:${v * 20}%"></i></div><b>${v}/5</b></div>`;
        out.innerHTML = `
          <section class="ai-result">
            ${bar("Clareza", r.scores.clareza)}${bar("Precisão jurídica", r.scores.precisao)}${bar("Concisão", r.scores.concisao)}
            <p>${esc(r.feedback)}</p>
            ${r.model ? `<div class="example"><p class="kicker">Sugestão</p><p lang="en">${esc(r.model)} ${speakBtn(r.model, true)}</p></div>` : ""}
          </section>`;
        bindSpeak(out);
        const total = r.scores.clareza + r.scores.precisao + r.scores.concisao;
        store.completeReview({ xpEarned: 5 + total, correct: 1, total: 1 });
        btn.disabled = false;
      }).catch((err) => {
        out.innerHTML = errorBox(err);
        btn.disabled = false;
      });
    };
  }

  // ---------- roleplay ----------
  const STARTER = { role: "user", text: "(Comece a conversa como o personagem. Sem dica nesta primeira fala.)", hidden: true };

  function roleplay(id) {
    const sc = SCENARIOS.find((s) => s.id === id);
    if (!sc) { location.hash = "#/studio"; return; }
    const msgs = [STARTER];
    const tips = {};
    app().innerHTML = `
      <div class="chat" style="--c:${sc.color}">
        <div class="sub-top chat-top">
          <a class="icon-btn" href="#/studio" aria-label="Voltar">${ICON.back}</a>
          <div><h1>${esc(sc.title)}</h1><small>${esc(sc.sub)}</small></div>
          <button class="chip outline" id="end">Encerrar</button>
        </div>
        <div class="chat-log" id="log" aria-live="polite"></div>
        <div class="chat-bar">
          ${E.listen.supported ? `<button class="icon-btn mic-small" id="dictate" aria-label="Falar">${ICON.mic}</button>` : ""}
          <textarea id="msg" rows="1" lang="en" placeholder="Escreva em inglês…"></textarea>
          <button class="send" id="send" aria-label="Enviar" disabled>${ICON.arrow}</button>
        </div>
      </div>`;
    const log = document.getElementById("log");
    const input = document.getElementById("msg");
    const send = document.getElementById("send");
    let busy = false;

    function render(pending) {
      log.innerHTML = msgs.filter((m) => !m.hidden).map((m, i) => m.role === "assistant"
        ? `<div class="bubble them"><p lang="en">${esc(m.text)}</p>${speakBtn(m.text, true)}</div>`
        : `<div class="bubble me"><p lang="en">${esc(m.text)}</p></div>${tips[i] ? `<p class="tip"><b>Dica:</b> ${esc(tips[i])}</p>` : ""}`
      ).join("") + (pending ? `<div class="bubble them typing"><span class="dots"><i></i><i></i><i></i></span></div>` : "");
      bindSpeak(log);
      log.scrollTop = log.scrollHeight;
      window.scrollTo(0, document.body.scrollHeight);
    }

    function turn() {
      busy = true;
      send.disabled = true;
      render(true);
      E.ai.roleplayTurn(sc, msgs.map(({ role, text }) => ({ role, text }))).then(({ reply, tip }) => {
        const lastUser = msgs.filter((m) => !m.hidden).length - 1;
        if (tip && lastUser >= 0) tips[lastUser] = tip;
        msgs.push({ role: "assistant", text: reply });
        busy = false;
        render(false);
        send.disabled = !input.value.trim();
        E.voice.speak(reply);
      }).catch((err) => {
        busy = false;
        render(false);
        log.insertAdjacentHTML("beforeend", errorBox(err, "rp-retry"));
        const r = document.getElementById("rp-retry");
        if (r) r.onclick = () => { r.parentElement.remove(); turn(); };
      });
    }

    function submit() {
      const text = input.value.trim();
      if (!text || busy) return;
      msgs.push({ role: "user", text });
      input.value = "";
      input.style.height = "";
      turn();
    }

    input.oninput = () => {
      send.disabled = busy || !input.value.trim();
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    };
    input.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); e.stopPropagation(); submit(); } };
    send.onclick = submit;
    const dict = document.getElementById("dictate");
    if (dict) dict.onclick = () => {
      dict.classList.add("live");
      E.listen.start({
        onResult: (alts) => { input.value = (input.value + " " + alts[0]).trim(); input.oninput(); },
        onError: () => { dict.classList.remove("live"); input.placeholder = "Microfone indisponível. Escreva sua resposta."; },
        onEnd: () => dict.classList.remove("live")
      });
    };
    document.getElementById("end").onclick = () => {
      const turns = msgs.filter((m) => m.role === "user" && !m.hidden).length;
      if (!turns) { location.hash = "#/studio"; return; }
      summary(sc, msgs.filter((m) => !m.hidden));
    };
    turn();
  }

  function summary(sc, history) {
    app().innerHTML = `<div class="screen">${header(esc(sc.title))}${loading("Preparando seu feedback…")}</div>`;
    E.ai.roleplaySummary(sc, history).then((r) => {
      const turns = history.filter((m) => m.role === "user").length;
      store.completeReview({ xpEarned: 5 + turns * 2, correct: 1, total: 1 });
      app().innerHTML = `
        <div class="screen">
          ${header(esc(sc.title))}
          <section class="ai-result center">
            <div class="big-num"><b>${r.score}</b><span>de 10</span></div>
          </section>
          ${r.strengths.length ? `<section class="panel"><h2>Mandou bem</h2><ul>${r.strengths.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></section>` : ""}
          ${r.improvements.length ? `<section class="panel"><h2>Para a próxima</h2><ul>${r.improvements.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></section>` : ""}
          ${r.phrases.length ? `<section class="panel"><h2>Frases para guardar</h2>${r.phrases.map((p) => `<div class="phrase"><p lang="en">${esc(p.en)} ${speakBtn(p.en, true)}</p><small>${esc(p.pt || "")}</small></div>`).join("")}</section>` : ""}
          <div class="row-actions">
            <a class="btn ghost" href="#/studio">Voltar</a>
            <button class="btn primary" id="again">Jogar de novo</button>
          </div>
        </div>`;
      bindSpeak(app());
      document.getElementById("again").onclick = () => roleplay(sc.id);
    }).catch((err) => {
      app().innerHTML = `<div class="screen">${header(esc(sc.title))}${errorBox(err, "retry")}</div>`;
      const r = document.getElementById("retry");
      if (r) r.onclick = () => summary(sc, history);
    });
  }

  E.studio = { studio, practice, plain, roleplay, SCENARIOS, CLAUSES };
})(window.Elle);

</script>
  <script>
// NICE — rotas
window.Elle = window.Elle || {};

(function (E) {
  const V = E.views;

  function render() {
    const h = location.hash || "#/";
    E.runner.abort();
    let m;
    if ((m = h.match(/^#\/lesson\/([\w-]+)/))) return V.lesson(m[1]);
    if ((m = h.match(/^#\/studio\/practice(?:\/([\w-]+))?$/))) return E.studio.practice(m[1]);
    if (h === "#/studio/plain") return E.studio.plain();
    if ((m = h.match(/^#\/studio\/roleplay\/([\w-]+)/))) return E.studio.roleplay(m[1]);
    if (h === "#/studio") return E.studio.studio();
    if (h === "#/review/start") return V.reviewStart();
    if (h === "#/review") return V.review();
    if (h === "#/glossary") return V.glossary();
    if (h === "#/settings") return V.settings();
    if (h === "#/placement/start") return V.placementStart();
    if (h === "#/placement") return V.placementIntro(false);
    V.home();
    window.scrollTo(0, 0);
  }

  // Telas "paradas" que podem ser redesenhadas quando chega progresso do Drive
  const SAFE = ["", "#/", "#/review", "#/glossary", "#/settings", "#/studio"];
  function refreshIfIdle() {
    if (!E.runner.active && SAFE.includes(location.hash)) render();
  }

  E.app = { render, refreshIfIdle };
  E.ui.applyTheme();
  E.store.onChange(E.ui.applyTheme);
  window.addEventListener("hashchange", render);
  E.voice.onChange(() => { if (location.hash === "#/settings") V.settings(); });
  E.sync.onStatus(() => {
    document.querySelectorAll("[data-sync]").forEach((el) => {
      const tmp = document.createElement("div");
      tmp.innerHTML = V.cloudPill();
      el.replaceWith(tmp.firstElementChild || document.createTextNode(""));
    });
  });
  render();
  E.sync.init(refreshIfIdle);

  // Instalável no celular quando publicado (https). Abrindo direto do arquivo, é ignorado.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})(window.Elle);

</script>
</body>
